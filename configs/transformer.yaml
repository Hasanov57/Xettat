# M2: char-level Transformer encoder (from scratch). ~5M params.
seed: 42
ckpt_root: /data/teams/team14/checkpoints
runs_root: runs
model: {type: transformer, d_model: 256, heads: 4, layers: 6, ff: 1024, dropout: 0.1, max_len: 512}
data: {dir: data/processed, max_len: 512, augment: true, val_subset: 5000}
train:
  batch_size: 128
  lr: 0.0005
  weight_decay: 0.01
  warmup_steps: 2000
  max_steps: 80000
  eval_every: 2000
  ckpt_every: 1000
  patience: 6
  grad_clip: 1.0
  num_workers: 4
  log_every: 100
