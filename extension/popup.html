<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <title>Xəttat</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="popup">
  <div class="wrap">
    <header>
      <img src="icons/icon48.png" alt="">
      <h1>Xəttat <small>seher → səhər, ucun → üçün</small></h1>
    </header>
    <p id="note" class="note" hidden></p>
    <textarea id="text" placeholder="Mətni bura yazın və ya yapışdırın, məsələn: uzumun suyu uzume sicradi" autofocus></textarea>
    <div class="row">
      <button id="fix">Düzəlt</button>
      <button id="copy" class="secondary">Kopyala</button>
    </div>
    <div class="status"><span id="dot" class="dot"></span><span id="status">Model yoxlanılır…</span></div>
    <div class="hint">İstənilən saytda mətn sahəsində <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Space</kbd> basın və ya sağ klik → <b>Xəttat ilə düzəlt</b>.
      <a href="options.html" target="_blank">Ayarlar</a></div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
